[package]
name = "tree-archiver"
version = "1.0.0"
description = "Plan and build tar archives with an advanced include/exclude tree"
authors = ["dominik.dzienia@gmail.com"]
repository = "https://github.com/dlvoy/tree-archiver"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tree_archiver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
flate2 = "1"
dunce = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
